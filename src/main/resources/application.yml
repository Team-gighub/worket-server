spring:
  application:
    name: worket-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:test}?serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    show_sql: true
    properties:
      hibernate:
        format_sql: true
    hibernate:
      ddl-auto: ${DDL_AUTO:none}
    database-platform: org.hibernate.dialect.MySQLDialect

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT:dummy-client-id}
            client-secret: ${KAKAO_SECRET:dummy-secret}
            redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/login/oauth2/code/kakao}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            scope:
              - profile_nickname
            client-name: kakao

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

naver:
  ocr:
    secret: ${OCR_SECRET:dummy-ocr-secret}
    url: ${OCR_URL:https://dummy-ocr-url}

gemini:
  secret: ${GEMINI_SECRET:dummy-gemini-secret}
  model: ${GEMINI_MODEL:gemini-1.0}
  url: ${GEMINI_URL:https://dummy-gemini-url}

frontend:
  base-url: ${FRONTEND_BASE_URL:http://localhost:3000}

s3:
  bucket-api-url: ${S3_BUCKET_API_URL:https://dummy-s3-url}

jwt:
  secret-key: ${JWT_SECRET_KEY:Z3VAbXp5d0FOMlRrc2pCTE9wNkh4S1hCYWZsR1pCZ0Z4cHBXTXh0RQ==}

external:
  api:
    account-system:
      url: ${CHANNEL_SERVER_URL}

pg:
  api-key: ${PG_API_KEY}
