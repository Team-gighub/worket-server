plugins {
  id 'java'
  id 'org.springframework.boot' version '3.5.7'
  id 'io.spring.dependency-management' version '1.1.7'
  id 'com.diffplug.spotless' version '6.23.0'
}

group = 'gighub'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(17)
  }
}

configurations {
  compileOnly {
    extendsFrom annotationProcessor
  }
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-oauth2-client' //oauth 추가
  implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
  implementation 'io.jsonwebtoken:jjwt-impl:0.12.5'
  implementation 'io.jsonwebtoken:jjwt-jackson:0.12.5'
  implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // 테스트용 타임리프
  implementation 'org.springframework.boot:spring-boot-starter-validation' // 유효성 검사
  implementation("software.amazon.awssdk:s3:2.39.0")
  implementation 'software.amazon.awssdk:apache-client:2.39.0'
  implementation 'org.springframework.boot:spring-boot-starter-actuator'

  compileOnly 'org.projectlombok:lombok'
  runtimeOnly 'com.mysql:mysql-connector-j'
  annotationProcessor 'org.projectlombok:lombok'
  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
  useJUnitPlatform()
}
